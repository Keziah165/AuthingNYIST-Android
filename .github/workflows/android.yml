name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Report SrunClient errors as annotations
        if: failure()
        run: |
          echo "::error file=build.log::TOTAL_E=$(grep -cE '^e: ' build.log)"
          grep -E "^e: .*SrunClient\.kt" build.log | head -8 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error file=build.log::$line"; done

      - name: Report last Kotlin errors as annotations
        if: failure()
        run: |
          grep -E "^e: " build.log | tail -8 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error file=build.log::LAST|$line"; done

      - name: Report build log tail as annotations
        if: failure()
        run: |
          tail -20 build.log | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error file=build.log::TAIL|$line"; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NYIST-Connect-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
